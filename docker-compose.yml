# Local Postgres with pgvector, used ONLY for integration tests (DATABASE_URL_TEST)
services:
  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: icpilot_test
    ports: ["54329:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
